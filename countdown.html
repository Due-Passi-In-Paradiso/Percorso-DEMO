<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />

<title>Due Passi in Paradiso – Inaugurazione il 18 aprile</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<meta name="description" content="Due Passi in Paradiso sarà inaugurato il 18 aprile. Da quella data saranno disponibili mappa, informazioni sul sentiero, traccia GPS e diario delle memorie.">

<meta name="robots" content="index, follow" />
<link rel="icon" href="img/logo.jpg" type="image/jpeg">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #020617;
  color: #e5e7eb;
  position: relative;
}

.bg {
  position: fixed;
  inset: 0;
  background: url("img/sfondo_02.png") center center / cover no-repeat;
  filter: blur(5px);
  transform: scale(1.05);
  z-index: -1;
}

.page {
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 70px 16px 24px;
  box-sizing: border-box;
}

.card {
  width: 100%;
  max-width: 380px;
  margin: 0 auto;
  text-align: center;
}

.logo {
  width: 100%;
  max-width: 260px;
  margin: 0 auto 1rem;
  display: block;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

h1 {
  font-size: 1.5rem;
  margin: 0 0 0.8rem;
  text-shadow: 0 2px 6px rgba(0,0,0,0.6);
}

.message-box {
  margin-top: 1rem;
  background: rgba(15, 23, 42, 0.55);
  border-radius: 24px;
  padding: 20px 18px;
  box-shadow: 0 10px 18px rgba(0,0,0,0.35);
  backdrop-filter: blur(6px);
}

.message {
  font-size: 0.98rem;
  line-height: 1.5;
  text-shadow: 0 2px 6px rgba(0,0,0,0.6);
}

.date {
  font-weight: 800;
}

.note {
  margin-top: 1rem;
  font-size: 0.78rem;
  opacity: 0.9;
  line-height: 1.4;
  text-shadow: 0 2px 6px rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="page">
  <div class="card">

    <img class="logo" src="img/logo.jpg" alt="Due Passi in Paradiso">

    <h1>Due Passi in Paradiso</h1>

    <div class="message-box">
      <div class="message">
        Il percorso sarà inaugurato il <span class="date">18 aprile</span>.<br><br>
        Da quella data saranno disponibili su questo sito la mappa, le informazioni sul sentiero,
        la traccia GPS e il diario delle memorie.
      </div>
    </div>

    <p class="note">
      Ti invitiamo a tornare qui dopo l’inaugurazione per scoprire tutti i contenuti dedicati al percorso.
    </p>

  </div>
</div>

</body>
</html>
