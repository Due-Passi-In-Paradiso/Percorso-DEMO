<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Mappa – Due Passi in Paradiso</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #020617;
  color: #e5e7eb;
  position: relative;
}

/* Sfondo */
.bg {
  position: fixed;
  inset: 0;
  background: url("img/sfondo_02.png") center center / cover no-repeat;
  filter: blur(5px);
  transform: scale(1.05);
  z-index: -1;
}

/* Wrapper */
.page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  box-sizing: border-box;
}

/* Contenitore */
.card {
  width: 100%;
  max-width: 420px;
  text-align: center;
}

/* Titolo */
h1 {
  font-size: 1.5rem;
  margin: 0 0 1.2rem;
  text-shadow: 0 2px 6px rgba(0,0,0,0.6);
}

/* Bottoni */
.actions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  max-width: 320px;
  margin: 0 auto 18px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-weight: 700;
  font-size: 1rem;
  padding: 18px 14px;
  border-radius: 22px;
  box-shadow: 0 10px 18px rgba(0, 0, 0, 0.45);
  text-align: center;
  user-select: none;
}

.btn:active {
  transform: scale(0.98);
}

.cartografica {
  background: #60a5fa;
  color: #061a3a;
}

.artistica {
  background: #f97316;
  color: #3b0b00;
}

/* Riquadro info */
.info-box {
  max-width: 320px;
  margin: 0 auto 18px;
  background: rgba(15, 23, 42, 0.55);
  border-radius: 22px;
  padding: 16px 18px;
  box-shadow: 0 10px 18px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(6px);
  text-align: left;
}

.info-title {
  font-size: 0.95rem;
  font-weight: 800;
  margin-bottom: 10px;
  text-align: center;
}

.info-line {
  font-size: 0.92rem;
  line-height: 1.45;
  margin-bottom: 6px;
}

.info-line:last-child {
  margin-bottom: 0;
}

/* Pulsante home */
.back {
  display: inline-block;
  margin-top: 6px;
  padding: 10px 16px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.65);
  color: #e5e7eb;
  text-decoration: none;
  font-size: 0.85rem;
  box-shadow: 0 6px 14px rgba(0,0,0,0.35);
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="page">
  <div class="card">

    <h1>Mappa</h1>

    <div class="actions">
      <a class="btn cartografica"
         href="files/mappa-cartografica.pdf"
         target="_blank"
         rel="noopener">
        Mappa Cartografica
      </a>

      <a class="btn artistica"
         href="files/mappa-artistica.pdf"
         target="_blank"
         rel="noopener">
        Mappa Artistica
      </a>
    </div>

    <div class="info-box">
      <div class="info-title">Dati Indicativi</div>
      <div class="info-line"><strong>Tempo di percorrenza:</strong> 3h 30min</div>
      <div class="info-line"><strong>Dislivello:</strong> +500 m / -500 m</div>
      <div class="info-line"><strong>Lunghezza:</strong> 13,5 km</div>
    </div>

    <a class="back" href="index.html">← Torna alla home</a>

  </div>
</div>

</body>
</html>
