<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Mappa – Due Passi in Paradiso</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<style>

html, body {
margin:0;
padding:0;
height:100%;
}

body{
font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
background:#020617;
color:#e5e7eb;
position:relative;
}

/* Sfondo */
.bg{
position:fixed;
inset:0;
background:url("img/sfondo_02.png") center center / cover no-repeat;
filter:blur(5px);
transform:scale(1.05);
z-index:-1;
}

/* Wrapper */
.page{
min-height:100vh;
display:flex;
align-items:flex-start;
justify-content:center;
padding:60px 16px 24px;
box-sizing:border-box;
}

/* Contenitore */
.card{
width:100%;
max-width:360px;
margin:0 auto;
padding:8px 10px;
text-align:center;
}

/* Titolo */
h1{
font-size:1.6rem;
margin:0 0 1rem;
text-shadow:0 2px 6px rgba(0,0,0,0.6);
}

/* Sottotitolo */
.subtitle{
font-size:0.85rem;
margin:0 0 1rem;
color:#e5e7eb;
text-shadow:0 2px 6px rgba(0,0,0,0.6);
opacity:0.9;
}

/* Griglia bottoni */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
justify-content:center;
align-items:stretch;
width:100%;
max-width:320px;
margin:0 auto 16px;
}

/* Bottone stile app */
.tile{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-decoration:none;
font-weight:700;
font-size:0.9rem;
padding:16px 10px;
border-radius:22px;
box-shadow:0 10px 18px rgba(0,0,0,0.45);
text-align:center;
color:#000;
user-select:none;
gap:6px;
transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.tile:active{
transform:scale(0.96);
box-shadow:0 6px 12px rgba(0,0,0,0.35);
}

.tile-icon{
font-size:2.2rem;
line-height:1;
margin-bottom:2px;
}

/* Colori */
.cartografica{
background:#60a5fa;
color:#061a3a;
}

.artistica{
background:#f97316;
color:#3b0b00;
}

/* Riquadro info */
.info-box{
max-width:320px;
margin:0 auto 16px;
padding:16px 18px;
background:rgba(15,23,42,0.60);
border-radius:22px;
box-shadow:0 10px 18px rgba(0,0,0,0.35);
backdrop-filter:blur(6px);
text-align:left;
}

.info-title{
font-size:0.95rem;
font-weight:800;
margin-bottom:10px;
text-align:center;
color:#e5e7eb;
}

.info-line{
font-size:0.92rem;
line-height:1.45;
margin-bottom:6px;
color:#e5e7eb;
}

.info-line:last-child{
margin-bottom:0;
}

/* Pulsante ritorno */
.back{
display:inline-block;
margin-top:6px;
padding:10px 16px;
border-radius:999px;
background:rgba(15,23,42,0.65);
color:#e5e7eb;
text-decoration:none;
font-size:0.85rem;
box-shadow:0 6px 14px rgba(0,0,0,0.35);
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="page">
<div class="card">

<h1>Mappa</h1>
<p class="subtitle">Percorso escursionistico ad anello</p>

<div class="grid">

<a class="tile cartografica"
href="files/mappa-cartografica.pdf"
target="_blank"
rel="noopener">
<div class="tile-icon">🗺️</div>
<div>Mappa Cartografica</div>
</a>

<a class="tile artistica"
href="files/mappa-artistica.pdf"
target="_blank"
rel="noopener">
<div class="tile-icon">🎨</div>
<div>Mappa Artistica</div>
</a>

</div>

<div class="info-box">

<div class="info-title">Informazioni sul percorso</div>

<div class="info-line">
⏱ <strong>Tempo di percorrenza:</strong> 3h 30min
</div>

<div class="info-line">
⛰ <strong>Dislivello:</strong> +500 m / -500 m
</div>

<div class="info-line">
🥾 <strong>Lunghezza:</strong> 13,5 km
</div>

</div>

<a class="back" href="index.html">← Torna alla home</a>

</div>
</div>

</body>
</html>
