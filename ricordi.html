<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Memorie - Diario delle Memorie</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<style>

html,body{
margin:0;
padding:0;
height:100%;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#020617;
color:#e5e7eb;
}

.bg{
position:fixed;
inset:0;
background:url("img/fondo.png") center/cover no-repeat;
filter:blur(5px);
transform:scale(1.05);
z-index:-1;
}

.page{
max-width:820px;
margin:auto;
padding:22px 16px 40px;
}

h1{
text-align:center;
margin-bottom:10px;
}

.topbar{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:18px;
}

.pill{
display:inline-flex;
align-items:center;
gap:8px;
padding:10px 14px;
border-radius:999px;
background:rgba(15,23,42,.7);
color:#e5e7eb;
text-decoration:none;
font-weight:600;
font-size:.85rem;
box-shadow:0 6px 14px rgba(0,0,0,.35);
}

.plus{
width:18px;
height:18px;
border-radius:50%;
background:#22c55e;
color:#052e16;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
}

.list{
display:grid;
gap:14px;
}

.entry{
background:rgba(15,23,42,.55);
border-radius:18px;
padding:16px;
backdrop-filter:blur(6px);
box-shadow:0 8px 16px rgba(0,0,0,.35);
}

.meta{
opacity:.8;
font-size:.82rem;
margin-bottom:6px;
}

.text{
white-space:pre-wrap;
line-height:1.45;
}

.empty{
text-align:center;
padding:20px;
background:rgba(15,23,42,.45);
border-radius:16px;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="page">

<h1>Memorie</h1>

<div class="topbar">

<a class="pill" href="diario.html">
← Torna al Diario
</a>

<a class="pill"
href="https://tally.so/r/BzpGMe"
target="_blank" rel="noopener">
<div class="plus">+</div>
Scrivi un tuo ricordo
</a>

</div>

<div id="memorie" class="list">
<div class="empty">Caricamento memorie…</div>
</div>

</div>

<script>

async function loadMemorie(){

const container=document.getElementById("memorie");

try{

const res=await fetch("data/ricordi_raw.json",{cache:"no-store"});
const data=await res.json();

const approved=data
.filter(r=>r[""]==="APPROVED")

.map(r=>({

date:r["Submitted at"],
name:r["Il tuo nome (opzionale)"]||"Anonimo",
text:r["Il tuo ricordo"]

}))

.sort((a,b)=>b.date.localeCompare(a.date));

if(!approved.length){
container.innerHTML='<div class="empty">Nessun ricordo approvato.</div>';
return;
}

container.innerHTML="";

approved.forEach(m=>{

const d=new Date(m.date);

const dataIT=d.toLocaleDateString("it-IT",{
day:"2-digit",
month:"2-digit",
year:"numeric"
});

const el=document.createElement("div");
el.className="entry";

el.innerHTML=`
<div class="meta">${m.name} · ${dataIT}</div>
<div class="text">${m.text}</div>
`;

container.appendChild(el);

});

}catch(e){

container.innerHTML='<div class="empty">Errore caricamento memorie.</div>';
console.error(e);

}

}

loadMemorie();

</script>

</body>
</html>
